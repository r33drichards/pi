# pi web + mcp-js: a sessions-only browser UI whose sessions run JavaScript in
# the mcp-js engine with a per-session filesystem snapshot, no host access.
#
#   cp .env.example .env   # set PI_WEB_TOKEN and a provider key
#   docker compose up --build
#   open http://127.0.0.1:8600/?token=<PI_WEB_TOKEN>
#
# Config lives in docker/web/config/ (settings.json selects mcp-js and the
# default model; models.json declares custom providers). Sessions, heaps, and
# filesystem snapshots persist in the named volumes.
#
# The mcp-js image must include the session file endpoints (mcp-js#267). The
# published image tracks GitHub releases; set MCP_JS_IMAGE to a release that
# has them, or build from source with compose.mcp-js-source.yml.
services:
  mcp-js:
    image: ${MCP_JS_IMAGE:-wholelottahoopla/mcp-js:latest}
    command:
      - --http-port=3000
      - --heap-store=dir
      - --heap-dir=/data/heaps
      - --fs-store=dir
      - --session-db-path=/data/sessions
    volumes:
      - mcp-js-data:/data
    expose:
      - "3000"
    healthcheck:
      # The image has no curl; bash's /dev/tcp is enough to see the port open.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 5s
      timeout: 3s
      retries: 20

  pi-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    depends_on:
      mcp-js:
        condition: service_healthy
    environment:
      PI_WEB_TOKEN: ${PI_WEB_TOKEN:?set PI_WEB_TOKEN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    volumes:
      - ./docker/web/config:/config:ro
      - pi-agent:/data/agent
    ports:
      - "${PI_WEB_PORT:-8600}:8600"

volumes:
  mcp-js-data:
  pi-agent:
