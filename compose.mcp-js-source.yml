# Override: build mcp-js from a local checkout instead of the published image.
# The published wholelottahoopla/mcp-js image packages the latest GitHub
# release; until a release includes the session file endpoints
# (r33drichards/mcp-js#267), build from source:
#
#   MCP_JS_SRC=../mcp-js docker compose -f compose.yml -f compose.mcp-js-source.yml up --build
#
# The Rust release build downloads a prebuilt V8 and takes a while the first time.
services:
  mcp-js:
    image: mcp-js:source
    build:
      context: ${MCP_JS_SRC:-../mcp-js}
      dockerfile: Dockerfile.source
